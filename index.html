<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe7">
<title>헤어살롱</title>
<style>
:root{
  --bg:#f5efe7; --card:#fffdfa; --ink:#2a2420; --mute:#857a70; --line:#e6dccf;
  --accent:#8c4a3c; --accent-soft:#f1e1da;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100dvh}
#app{max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}

/* 홈 */
.home{padding:56px 24px 40px}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--accent);margin:0 0 10px}
.home h1{font-size:32px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);margin:10px 0 36px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 12px}
.app{display:flex;flex-direction:column;align-items:center;gap:9px}
.icon{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:36px;
  box-shadow:0 8px 18px -8px rgba(60,40,25,.45),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s}
.app:active .icon{transform:scale(.93)}
.label{font-size:13px;font-weight:600;text-align:center}
.foot{margin-top:48px;font-size:12px;color:var(--mute);text-align:center}

/* 공통 페이지 */
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;
  height:54px;padding:0 8px;background:rgba(245,239,231,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;margin:0;text-align:center;font-weight:700}
.back{font-size:16px;color:var(--accent);padding:10px 8px;font-weight:600}
.page{padding:20px 16px 48px}
.cat{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em;margin:24px 4px 8px}
.cat:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:600;font-size:16px}
.row small{color:var(--mute);font-size:13px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.note{color:var(--mute);font-size:13px;line-height:1.6;margin:16px 4px 0}

/* 회원권 */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.mcard h2{margin:0;font-size:20px}
.mcard .mp{font-size:24px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:99px;margin:6px 0 10px}
.mcard ul{margin:0;padding-left:18px;color:var(--mute);font-size:14px;line-height:1.8}

/* 폼 */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--mute);font-weight:600}
.field input,.field select{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:0 14px;font-size:18px;font-weight:600;width:100%;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:var(--ink);color:#fbf6ef;border-radius:18px;padding:20px;margin-top:8px}
.result h3{margin:0 0 4px;font-size:13px;font-weight:600;opacity:.65;letter-spacing:.06em}
.ratio{font-size:30px;font-weight:700;margin:0 0 14px;font-variant-numeric:tabular-nums}
.rrow{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.14);font-size:16px}
.rrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.warn{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;margin-top:8px}

/* 컬러진단 */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:none;height:40px;border-radius:10px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:disabled{opacity:.45}
.drop{display:grid;place-items:center;gap:6px;border:2px dashed #cfc2b2;border-radius:18px;padding:40px 16px;
  text-align:center;color:var(--mute);background:var(--card)}
.drop strong{color:var(--ink);font-size:16px}
.drop span{font-size:34px}
.cvwrap{position:relative;border-radius:16px;overflow:hidden;line-height:0;background:#000;touch-action:manipulation}
.cvwrap canvas{width:100%;height:auto}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.del{position:absolute;top:10px;right:10px;border:0;border-radius:99px;padding:9px 14px;line-height:1;
  background:rgba(30,22,16,.72);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(6px)}
.hint{font-size:14px;color:var(--mute);margin:10px 4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;font-size:14px}
.picked{display:flex;align-items:center;gap:12px;margin:14px 4px 8px;font-weight:600}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.match{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;border:0;background:none;text-align:left}
.match+.match{border-top:1px solid var(--line)}
.sw{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.match b{display:block;font-size:16px}
.match small{color:var(--mute);font-size:13px}
.pct{margin-left:auto;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border:0;background:none;padding:0;display:grid;gap:4px;justify-items:center;font-size:10px;min-width:0;overflow-wrap:anywhere;line-height:1.2;align-content:start;font-weight:600;color:var(--mute)}
.cell i{display:block;width:100%;aspect-ratio:1;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(30,22,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .big{height:110px;border-radius:16px;margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:4px 0 0;color:var(--mute)}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0;line-height:1.6;white-space:pre-wrap}
.recipe h4{margin:0 0 4px;font-size:13px;color:var(--accent)}
.btn{display:block;width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:none;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="charts.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const APPS = [
  { id:'tea',   name:'티메뉴',       icon:'🍵', bg:'linear-gradient(140deg,#a9c59a,#5f8a5a)' },
  { id:'member',name:'회원권',       icon:'💳', bg:'linear-gradient(140deg,#e2c48a,#b98a3e)' },
  { id:'price', name:'요금표',       icon:'📋', bg:'linear-gradient(140deg,#c9b8a6,#8d7762)' },
  { id:'calc',  name:'염모제 계산기', icon:'🧪', bg:'linear-gradient(140deg,#9db7d8,#55739f)' },
  { id:'color', name:'컬러진단기',   icon:'🎨', bg:'linear-gradient(140deg,#e3a79b,#a8574a)' },
];

const shell = (title, body) =>
  `<header class="bar"><a class="back" href="#">‹ 홈</a><h1>${title}</h1><span></span></header><main class="page">${body}</main>`;

/* ---------- 홈 ---------- */
function home() {
  app.innerHTML = `<div class="home">
    <p class="eyebrow">WELCOME</p>
    <h1>${esc(SALON.name)}</h1>
    <p class="sub">${esc(SALON.tagline)}</p>
    <div class="grid">${APPS.map(a => `
      <a class="app" href="#${a.id}">
        <span class="icon" style="background:${a.bg}">${a.icon}</span>
        <span class="label">${a.name}</span>
      </a>`).join('')}</div>
    <p class="foot">원하시는 메뉴를 눌러주세요</p>
  </div>`;
}

/* ---------- 티메뉴 / 요금표 ---------- */
function list(title, data, note) {
  app.innerHTML = shell(title, data.map(c => `
    <div class="cat">${esc(c.cat)}</div>
    <div class="card">${c.items.map(i => `
      <div class="row"><b>${esc(i.name)}</b>${
        i.price ? `<span class="price">${esc(i.price)}</span>` : `<small>${esc(i.desc || '')}</small>`}</div>`).join('')}
    </div>`).join('') + (note ? `<p class="note">${esc(note)}</p>` : ''));
}

/* ---------- 회원권 ---------- */
function member() {
  app.innerHTML = shell('회원권', MEMBERSHIP.map(m => `
    <div class="mcard">
      <h2>${esc(m.name)}</h2>
      <div class="mp">${esc(m.price)}</div>
      <span class="badge">${esc(m.bonus)}</span>
      <ul>${m.benefits.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
    </div>`).join('') + `<p class="note">${esc(MEMBERSHIP_NOTE)}</p>`);
}

/* ---------- 염모제 계산기 ---------- */
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function mix(target, a, b, total) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  if (![target, a, b, total].every(Number.isFinite) || total <= 0) return { err: '숫자를 모두 입력해주세요.' };
  if (lo === hi) return target === lo ? { parts: [1, 0], lo, hi } :
    { err: `두 염모제가 모두 ${lo}레벨이라 ${target}레벨을 만들 수 없어요.` };
  if (target < lo || target > hi)
    return { err: `${lo}레벨과 ${hi}레벨을 섞으면 ${lo}~${hi}레벨 사이만 만들 수 있어요. ${target}레벨은 범위 밖입니다.` };
  let pLo = hi - target, pHi = target - lo;          // 낮은 레벨 : 높은 레벨
  let x = Math.round(pLo * 10), y = Math.round(pHi * 10), g = gcd(x, y) || 1;
  return { parts: [x / g, y / g], lo, hi, gLo: total * pLo / (pLo + pHi), gHi: total * pHi / (pLo + pHi) };
}
function calc(params) {
  const t0 = params.get('t') || 7;
  app.innerHTML = shell('염모제 계산기', `
    <div class="field"><label>원하는 레벨</label><input id="t" type="number" inputmode="decimal" step="0.5" value="${esc(t0)}"></div>
    <div class="two">
      <div class="field"><label>염모제 ① 레벨</label><input id="a" type="number" inputmode="decimal" step="0.5" value="3"></div>
      <div class="field"><label>염모제 ② 레벨</label><input id="b" type="number" inputmode="decimal" step="0.5" value="10"></div>
    </div>
    <div class="two">
      <div class="field"><label>염모제 총량 (g)</label><input id="g" type="number" inputmode="decimal" value="60"></div>
      <div class="field"><label>산화제 비율</label>
        <select id="ox"><option value="1">1 : 1</option><option value="1.5">1 : 1.5</option><option value="2">1 : 2</option></select></div>
    </div>
    <div id="out"></div>
    <p class="note">레벨을 평균으로 계산한 기준값입니다. 실제 발색은 모발 상태·제품 라인에 따라 달라질 수 있어요.</p>`);
  const run = () => {
    const v = id => parseFloat($('#' + id).value);
    const total = v('g'), ox = v('ox'), r = mix(v('t'), v('a'), v('b'), total);
    const f = n => (Math.round(n * 10) / 10).toFixed(1) + ' g';
    if (r.err) { $('#out').innerHTML = `<div class="warn">${esc(r.err)}</div>`; return; }
    const one = r.parts[1] === 0 || r.parts[0] === 0;
    const rows = one
      ? `<div class="rrow"><span>${v('t')}레벨 염모제</span><span>${f(total)}</span></div>`
      : `<div class="rrow"><span>${r.lo}레벨 염모제</span><span>${f(r.gLo)}</span></div>
         <div class="rrow"><span>${r.hi}레벨 염모제</span><span>${f(r.gHi)}</span></div>`;
    $('#out').innerHTML = `<div class="result">
      <h3>${one ? '단독 사용' : `${r.lo}레벨 : ${r.hi}레벨`}</h3>
      <p class="ratio">${one ? '섞지 않아도 됩니다' : `${r.parts[0]} : ${r.parts[1]}`}</p>
      ${rows}
      <div class="rrow"><span>산화제</span><span>${f(total * ox)}</span></div>
    </div>`;
  };
  app.querySelectorAll('input,select').forEach(e => e.addEventListener('input', run));
  run();
}

/* ---------- 컬러진단기 ---------- */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function lab([r, g, b]) {
  [r, g, b] = [r, g, b].map(v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; });
  let x = (r * .4124 + g * .3576 + b * .1805) / .95047, y = r * .2126 + g * .7152 + b * .0722,
      z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
  [x, y, z] = [x, y, z].map(v => v > .008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
DYES.forEach(d => d.lab = lab(hex2rgb(d.hex)));
const brandName = id => (BRANDS.find(b => b.id === id) || {}).name || id;
const cs = { tab: 'photo', brand: 'all', picked: null, pin: null };
const inBrand = d => cs.brand === 'all' || d.brand === cs.brand;
const title = d => d.name ? `${esc(d.code)} · ${esc(d.name)}` : esc(d.code);
const subt = d => esc(d.line) + (d.level ? ` · ${d.level}레벨` : '');

function nearest(rgb, n = 3) {
  const L = lab(rgb);
  return DYES.filter(inBrand)
    .map(d => ({ d, e: Math.hypot(L[0] - d.lab[0], L[1] - d.lab[1], L[2] - d.lab[2]) }))
    .sort((a, b) => a.e - b.e).slice(0, n);
}
function sheet(d) {
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet">
    <div class="big" style="background:${d.hex}"></div>
    <h2>${title(d)}</h2>
    <p>${esc(brandName(d.brand))} · ${subt(d)}</p>
    <div class="recipe"><h4>혼합 비율 · 사용법</h4>${d.recipe ? esc(d.recipe) : '차트에 표기된 혼합 정보가 없습니다.'}</div>
    ${d.level ? `<button class="btn" id="go">${d.level}레벨 배합 계산하기</button>` : ''}
    <button class="btn ghost" id="x">닫기</button></div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.id === 'x') el.remove(); });
  if ($('#go', el)) $('#go', el).onclick = () => { el.remove(); location.hash = 'calc?t=' + d.level; };
  document.body.appendChild(el);
}
function color() {
  const chips = [{ id: 'all', name: '전체' }, ...BRANDS].map(b => `<button class="chip ${b.id === cs.brand ? 'on' : ''}" data-b="${b.id}">${esc(b.name)}</button>`).join('');
  const list = DYES.filter(inBrand);
  const photo = `
    <div id="stage">
      <label class="drop"><span>📷</span><strong>헤어컬러 사진 올리기</strong>사진을 찍거나 앨범에서 골라주세요
        <input id="file" type="file" accept="image/*" hidden></label>
    </div>
    <div id="res"></div>`;
  const lines = [...new Set(list.map(d => d.brand + '|' + d.line))];
  const chart = lines.map(k => { const [b, ln] = k.split('|'); return `<div class="cat">${cs.brand === 'all' ? esc(brandName(b)) + ' · ' : ''}${esc(ln)}</div>
    <div class="chart">${list.map((d, i) => d.brand === b && d.line === ln ?
      `<button class="cell" data-i="${i}"><i style="background:${d.hex}"></i>${esc(d.code)}</button>` : '').join('')}</div>`; }).join('');
  app.innerHTML = shell('컬러진단기', `
    <div class="tabs"><button data-t="photo" class="${cs.tab === 'photo' ? 'on' : ''}">사진으로 찾기</button>
      <button data-t="chart" class="${cs.tab === 'chart' ? 'on' : ''}">차트에서 선택</button></div>
    <div class="chips">${chips}</div>
    ${cs.tab === 'photo' ? photo : chart}
    `);

  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { cs.tab = b.dataset.t; color(); });
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { cs.brand = b.dataset.b; color(); });
  app.querySelectorAll('.cell').forEach(b => b.onclick = () => sheet(list[b.dataset.i]));
  if (cs.tab !== 'photo') return;
  $('#file').onchange = e => e.target.files[0] && loadPhoto(e.target.files[0]);
  if (cs.img) drawPhoto();
}
function loadPhoto(file) {
  const img = new Image();
  img.onload = () => { cs.img = img; cs.picked = cs.pin = null; drawPhoto(); };
  img.src = URL.createObjectURL(file);
}
function drawPhoto() {
  const img = cs.img, w = Math.min(img.naturalWidth || img.width, 1000);
  $('#stage').innerHTML = `<div class="cvwrap"><canvas id="cv"></canvas><div class="pin" hidden></div>
      <button class="del" id="again" aria-label="사진 지우기">✕ 사진 지우기</button></div>
    <p class="hint">👆 사진에서 원하는 머리 색 부분을 눌러주세요</p>`;
  const c = $('#cv'), ctx = c.getContext('2d', { willReadFrequently: true });
  c.width = w; c.height = Math.round((img.naturalHeight || img.height) * w / (img.naturalWidth || img.width));
  ctx.drawImage(img, 0, 0, c.width, c.height);
  $('#again').onclick = () => { cs.img = cs.picked = cs.pin = null; color(); };
  c.onpointerdown = e => {
    const r = c.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const R = Math.max(5, Math.round(c.width * .022));
    const x0 = Math.max(0, Math.round(px * c.width) - R), y0 = Math.max(0, Math.round(py * c.height) - R);
    const d = ctx.getImageData(x0, y0, Math.min(2 * R, c.width - x0), Math.min(2 * R, c.height - y0)).data;
    let s = [0, 0, 0], n = 0;
    for (let i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; n++; }
    cs.picked = s.map(v => Math.round(v / n)); cs.pin = [px, py];
    showMatch();
  };
  showMatch();
}
function showMatch() {
  const pin = $('.pin'), res = $('#res');
  if (!cs.picked || !pin) { if (res) res.innerHTML = ''; return; }
  pin.hidden = false; pin.style.left = cs.pin[0] * 100 + '%'; pin.style.top = cs.pin[1] * 100 + '%';
  pin.style.background = `rgb(${cs.picked})`;
  const m = nearest(cs.picked);
  res.innerHTML = `<div class="picked"><span class="dot" style="background:rgb(${cs.picked})"></span>선택한 색과 가까운 염모제</div>
    <div class="card">${m.map((x, i) => `<button class="match" data-i="${i}">
      <span class="sw" style="background:${x.d.hex}"></span>
      <span><b>${title(x.d)}</b><small>${esc(brandName(x.d.brand))} · ${subt(x.d)}</small></span>
      <span class="pct">${Math.max(0, Math.round(100 - x.e))}%</span></button>`).join('')}</div>
    <p class="note">사진의 조명·보정에 따라 실제 색과 차이가 날 수 있어요. 디자이너와 함께 확인해 주세요.</p>`;
  res.querySelectorAll('.match').forEach(b => b.onclick = () => sheet(m[b.dataset.i].d));
}

/* ---------- 라우터 ---------- */
function route() {
  document.querySelectorAll('.scrim').forEach(e => e.remove());
  const [id, q] = location.hash.slice(1).split('?');
  const params = new URLSearchParams(q || '');
  document.title = SALON.name;
  ({ tea: () => list('티메뉴', TEA),
     price: () => list('요금표', PRICES, PRICES_NOTE),
     member, calc: () => calc(params), color }[id] || home)();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
